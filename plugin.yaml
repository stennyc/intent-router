name: intent-router
version: "3.5.2"
description: "动态专家上下文路由 v3.5.1 — 锚点专家注入 + 委派专家通道（v3.5.1: 收敛为 subagent_inject 派发后子 agent 自分类注入专家；v3.5 的 pre_tool_call 强制改写 goal 经实测在 background/async delegation 传不到子 agent（白通道）已移除，hint 卡派发前面（冗余第三通道，实盘零触发）一并移除）+ 压缩后蒸馏卡补注 + 完成重入轮 completion-skip + /expert 手动覆盖 + 两注入面开关（anchor_inject 主agent首轮 / subagent_inject 派发后子agent自分类）+ P0 子 session 平台守卫（subagent-guard）"
author: hermes-agent
license: MIT
config_schema:
  anchor_inject:
    type: bool
    default: true
    description: 首轮自动锚点注入开关（① 主 agent 是否首轮注入专家）。profile 的 SOUL.md 已含专家 persona（域 profile）时设 false：跳过首轮分类+注入（免重复+免稀释），/expert 手动切换不受影响。
  subagent_inject:
    type: bool
    default: true
    description: 按任务把专家注入到子 agent 开关（② 动态配置专家）。true（缺省）时子 agent（platform=subagent）的回合复用首轮「分类→命中≥gate→注入专家全文」流水线，按子任务域动态注入（记 subagent-inject）；false 才保持 P0 subagent-guard 全拦（子 agent 零注入，靠 delegate_task.context 自读 experts/<slug>.md）。owner 2026-11-19 拍板缺省放行。
