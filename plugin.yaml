name: intent-router
version: "3.5"
description: "动态专家上下文路由 v3.5 — 锚点专家注入 + 委派专家绑定（v3.5: pre_tool_call 拦 delegate_task 强制把'作为 X 专家 + 读 experts/<slug>.md'改写进 goal/context, 根治主 agent 绕过 hint 卡）+ 压缩后蒸馏卡补注 + 完成重入轮 completion-skip + /expert 手动覆盖 + 三注入面开关（anchor_inject 主agent首轮 / subagent_inject 派发后子agent自分类, 缺省true / hint_inject 派发前hint卡）+ P0 子 session 平台守卫 + G1 短消息护栏（唯一静默门, 语言无关）"
author: hermes-agent
license: MIT
config_schema:
  anchor_inject:
    type: bool
    default: true
    description: 首轮自动锚点注入开关（① 主 agent 是否首轮注入专家）。profile 的 SOUL.md 已含专家 persona（域 profile）时设 false：跳过首轮分类+注入（免重复+免稀释），/expert 手动切换不受影响。
  subagent_inject:
    type: bool
    default: true
    description: 按任务把专家注入到子 agent 开关（② 动态配置专家）。true（缺省）时子 agent（platform=subagent）的回合复用首轮「分类→命中≥gate→注入专家全文」流水线，按子任务域动态注入（记 subagent-inject）；false 才保持 P0 subagent-guard 全拦（子 agent 零注入，靠 delegate_task.context 自读 experts/<slug>.md）。owner 2026-11-19 拍板缺省放行。
  hint_inject:
    type: bool
    default: true
    description: 「派发前选专家」面开关（hint 卡）。主 agent 后续轮检测到新域时发 hint 卡（goal 指定 slug + context 让子 agent 读 experts/<slug>.md）。true（缺省）保留 hint 卡；false 关 → 主 agent 不预设专家, 全权交给 subagent_inject（派发后子 agent 自分类）或主 agent 自答。owner 2026-11-19 用于实测"派发前选 vs 派发后自分类"哪个正常工作。
